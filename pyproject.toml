[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitsquid"
version = "0.1.0"
description = "A Git client for one repository at a time: graph, staging down to the line, blame, and history, in a local page."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Drives the page itself. The browser binary is a separate download:
    #   python -m playwright install webkit
    "playwright>=1.40",
]

[project.scripts]
gitsquid = "gitsquid.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gitsquid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:gitsquid.*"]
