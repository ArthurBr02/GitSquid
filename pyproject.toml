[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitia"
version = "0.1.0"
description = "Repository-local Git client assistant: index one codebase, propose diffs, run tests, record every change."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
gitia = "gitia.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gitia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:gitia.*"]
