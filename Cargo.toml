[workspace]
resolver = "2"
members = ["crates/gitsquid-core", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"

# Profiles only take effect at the workspace root; a member's own section is ignored.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
