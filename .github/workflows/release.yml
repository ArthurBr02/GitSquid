name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    # Tauri bundles for the operating system it runs on; there is no cross-compilation, so a
    # release means one runner per platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux webview toolchain
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run build:${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: gitsquid-${{ matrix.target }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          if-no-files-found: error
