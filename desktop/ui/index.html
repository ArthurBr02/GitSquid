<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitSquid</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #14161c; color: #e6eaf2;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .boot { text-align: center; max-width: 560px; padding: 0 32px; }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 22px; border-radius: 16px;
    background: linear-gradient(140deg, #3fc7bb, #4f9dff);
  }
  h1 { margin: 0 0 6px; font-size: 19px; letter-spacing: .3px; }
  p { margin: 0; color: #98a1b3; }
  .state { margin-top: 20px; display: flex; align-items: center; gap: 9px; justify-content: center; color: #98a1b3; }
  .spinner {
    width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.18);
    border-top-color: #4f9dff; border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error {
    display: none; margin-top: 22px; text-align: left;
    background: rgba(255,107,107,.09); border: 1px solid rgba(255,107,107,.34);
    border-radius: 9px; padding: 14px 16px; color: #ffa8a8;
  }
  .error h2 { margin: 0 0 7px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .error pre {
    margin: 10px 0 0; white-space: pre-wrap; user-select: text;
    font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #e8ecf4;
  }
  body.failed .state { display: none; }
  body.failed .error { display: block; }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: .001ms; } }
</style>
</head>
<body>
  <div class="boot">
    <div class="mark" aria-hidden="true"></div>
    <h1>GitSquid</h1>
    <p>Repository-local Git client assistant</p>
    <div class="state" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="message">Starting the local engine…</span>
    </div>
    <div class="error" role="alert">
      <h2>The engine did not start</h2>
      <p id="detail"></p>
      <pre id="output"></pre>
    </div>
  </div>

<script>
  // Called from the Rust side while the backend boots.
  window.gitsquidStatus = (payload) => {
    if (payload.message) document.getElementById("message").textContent = payload.message;
    if (!payload.error) return;
    document.body.classList.add("failed");
    document.getElementById("detail").textContent = payload.error;
    document.getElementById("output").textContent = payload.output || "";
  };
</script>
</body>
</html>
