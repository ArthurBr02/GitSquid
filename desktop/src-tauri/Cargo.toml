[package]
name = "gitsquid-desktop"
version.workspace = true
edition.workspace = true
description = "Native desktop shell for GitSquid."
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitsquid-core = { path = "../../crates/gitsquid-core" }
# devtools stays on in release: this is a personal local tool, and being able to
# open the console on the page it hosts is worth more than hiding it.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
